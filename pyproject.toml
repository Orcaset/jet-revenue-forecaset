[project]
name = "jev-revenue-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "orcaset>=0.12.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
]

[tool.pyrefly]
project-includes = ["main.py", "rev_model", "tests"]

[tool.pyrefly.errors]
implicit-any-type-argument = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
